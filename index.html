<body>
  <div id="app"></div>
  <div id="specialLayer" aria-live="assertive"></div>
  <div id="toast" class="toast" role="status"></div>

  <script>
    // ============================================================
    // ここだけ書き換えます。
    // Cloudflare Workersへ公開したときに表示されたURLを貼り付けてください。
    // 例: https://tiger-dragon-server.saba.workers.dev
    // ============================================================
    window.TD_SERVER_URL = 'https://tiger-dragon-server.naitoryo7110.workers.dev';
  </script>

  <script>
(() => {
  'use strict';

  const normalizeBaseUrl = (value) => String(value || '').trim().replace(/\/$/, '');
  const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

  class TigerDragonSocket {
    constructor(baseUrl) {
      this.baseUrl = normalizeBaseUrl(baseUrl);
      this.ws = null;
      this.roomId = null;
      this.handlers = new Map();
      this.pending = new Map();
      this.requestNo = 0;
      this.manualClose = false;
      this.connecting = null;
      this.reconnectNo = 0;
    }

    on(event, handler) {
      const list = this.handlers.get(event) || [];
      list.push(handler);
      this.handlers.set(event, list);
    }

    fire(event, payload) {
      for (const handler of this.handlers.get(event) || []) {
        try { handler(payload); } catch (error) { console.error(error); }
      }
    }

    validConfig() {
      return /^https?:\/\//.test(this.baseUrl) && !this.baseUrl.includes('YOUR-WORKER-NAME');
    }

    async fetchLobby() {
      if (!this.validConfig()) throw new Error('config.jsにCloudflare WorkersのURLを設定してください。');
      const response = await fetch(`${this.baseUrl}/api/lobby`, { cache:'no-store' });
      if (!response.ok) throw new Error(`部屋情報の取得に失敗しました（${response.status}）。`);
      const data = await response.json();
      return data.rooms || [];
    }

    async refreshLobby() {
      try {
        const rooms = await this.fetchLobby();
        this.fire('lobbyState', rooms);
      } catch (error) {
        this.fire('networkError', { message:error.message });
      }
    }

    socketUrl(roomId) {
      const url = new URL(`${this.baseUrl}/api/rooms/${encodeURIComponent(roomId)}/ws`);
      url.protocol = url.protocol === 'https:' ? 'wss:' : 'ws:';
      return url.toString();
    }

    async connect(roomId) {
      const nextRoom = String(roomId);
      if (!this.validConfig()) throw new Error('config.jsにCloudflare WorkersのURLを設定してください。');
      if (this.ws?.readyState === WebSocket.OPEN && this.roomId === nextRoom) return;
      if (this.connecting && this.roomId === nextRoom) return this.connecting;
      this.manualClose = false;
      this.roomId = nextRoom;
      if (this.ws) {
        try { this.ws.close(1000, 'switch room'); } catch {}
      }
      this.connecting = new Promise((resolve, reject) => {
        const ws = new WebSocket(this.socketUrl(nextRoom));
        this.ws = ws;
        const timeout = setTimeout(() => {
          try { ws.close(); } catch {}
          reject(new Error('対戦サーバーへ接続できませんでした。'));
        }, 10000);
        ws.addEventListener('open', () => {
          clearTimeout(timeout);
          this.connecting = null;
          this.reconnectNo = 0;
          this.fire('connect');
          resolve();
        }, { once:true });
        ws.addEventListener('message', (event) => this.handleMessage(event.data));
        ws.addEventListener('close', () => this.handleClose(ws));
        ws.addEventListener('error', () => {
          if (ws.readyState !== WebSocket.OPEN) {
            clearTimeout(timeout);
            this.connecting = null;
            reject(new Error('対戦サーバーとの接続に失敗しました。'));
          }
        });
      });
      return this.connecting;
    }

    handleMessage(raw) {
      let message;
      try { message = JSON.parse(raw); } catch { return; }
      if (message.type === 'ack') {
        const pending = this.pending.get(message.id);
        if (!pending) return;
        clearTimeout(pending.timer);
        this.pending.delete(message.id);
        pending.ack(message.result);
        return;
      }
      if (message.type === 'event') this.fire(message.event, message.payload);
    }

    async handleClose(ws) {
      if (this.ws !== ws) return;
      this.ws = null;
      this.connecting = null;
      for (const pending of this.pending.values()) {
        clearTimeout(pending.timer);
        pending.ack({ ok:false, error:'サーバーとの接続が切れました。' });
      }
      this.pending.clear();
      this.fire('disconnect');
      if (this.manualClose || !this.roomId) return;
      this.reconnectNo += 1;
      await sleep(Math.min(5000, 600 * this.reconnectNo));
      if (!this.manualClose && this.roomId) {
        this.connect(this.roomId).catch(() => {});
      }
    }

    emit(event, payload = {}, ack = () => {}) {
      const send = async () => {
        try {
          if (event === 'joinRoom') await this.connect(payload.roomId);
          if (!this.ws || this.ws.readyState !== WebSocket.OPEN) throw new Error('対戦サーバーへ接続されていません。');
          const id = `${Date.now()}-${++this.requestNo}`;
          const timer = setTimeout(() => {
            this.pending.delete(id);
            ack({ ok:false, error:'サーバーから応答がありません。' });
          }, 12000);
          this.pending.set(id, { ack, timer });
          this.ws.send(JSON.stringify({ type:'command', id, event, payload }));
        } catch (error) {
          ack({ ok:false, error:error.message || '通信に失敗しました。' });
        }
      };
      send();
    }

    disconnectRoom() {
      this.manualClose = true;
      this.roomId = null;
      if (this.ws) {
        try { this.ws.close(1000, 'leave room'); } catch {}
      }
      this.ws = null;
    }
  }

  window.TigerDragonSocket = TigerDragonSocket;
})();

  </script>

  <script>
const socket = new TigerDragonSocket(window.TD_SERVER_URL);
const app = document.querySelector('#app');
const toast = document.querySelector('#toast');
const specialLayer = document.querySelector('#specialLayer');

let rooms = [];
let state = null;
let rulesOpen = false;
let busy = false;
let name = localStorage.getItem('td:name') || '';
let lastRoomId = localStorage.getItem('td:lastRoom') || '';
let lastSpecialId = null;
let connectionMessage = '';
let settingsDraft = null;
let settingsSaveTimer = null;

const BGM_PLAYLIST_URL = './bgm/playlist.txt';
const bgmAudio = new Audio();
bgmAudio.preload = 'none';
let bgmTracks = [];
let bgmTrackIndex = -1;
let bgmFailedIndexes = new Set();
let bgmPlaylistLoaded = false;
let bgmPlaylistPromise = null;
let bgmRetryTimer = null;
let bgmVolume = Number(localStorage.getItem('td:bgmVolume') ?? 0);
if (!Number.isFinite(bgmVolume)) bgmVolume = 0;
bgmVolume = Math.max(0, Math.min(100, Math.round(bgmVolume)));
bgmAudio.volume = bgmVolume / 100;

function trackUrl(line) {
  const value = line.trim();
  if (/^https?:\/\//i.test(value)) return value;
  return new URL(value.includes('/') ? value : `./bgm/${value}`, location.href).toString();
}

function trackName(url) {
  if (!url) return '停止中';
  try { return decodeURIComponent(new URL(url).pathname.split('/').pop() || 'BGM'); }
  catch { return 'BGM'; }
}

async function loadBgmPlaylist() {
  if (bgmPlaylistLoaded) return bgmTracks;
  if (bgmPlaylistPromise) return bgmPlaylistPromise;
  bgmPlaylistPromise = fetch(BGM_PLAYLIST_URL, { cache:'no-store' })
    .then((response) => {
      if (!response.ok) throw new Error('playlist.txtが見つかりません。');
      return response.text();
    })
    .then((text) => {
      bgmTracks = [...new Set(text.split(/\r?\n/)
        .map((line) => line.trim())
        .filter((line) => line && !line.startsWith('#'))
        .map(trackUrl))];
      bgmPlaylistLoaded = true;
      updateBgmControls();
      return bgmTracks;
    })
    .catch((error) => {
      console.warn('BGM playlist:', error.message);
      bgmTracks = [];
      bgmPlaylistLoaded = true;
      updateBgmControls();
      return bgmTracks;
    });
  return bgmPlaylistPromise;
}

function updateBgmControls() {
  document.querySelectorAll('.bgm-volume').forEach((input) => { input.value = String(bgmVolume); });
  document.querySelectorAll('.bgm-value').forEach((node) => { node.textContent = `${bgmVolume}%`; });
  const allFailed = bgmTracks.length > 0 && bgmFailedIndexes.size >= bgmTracks.length;
  const label = bgmTracks.length
    ? (allFailed ? '再生できる曲なし' : (bgmTrackIndex >= 0 ? trackName(bgmTracks[bgmTrackIndex]) : (bgmVolume > 0 ? '再生準備中' : '停止中')))
    : (bgmPlaylistLoaded ? '曲未登録' : '読込中');
  document.querySelectorAll('.bgm-track').forEach((node) => { node.textContent = label; node.title = label; });
}

function queueNextBgm() {
  clearTimeout(bgmRetryTimer);
  if (bgmVolume <= 0) return;
  bgmRetryTimer = setTimeout(() => playRandomBgm(), 80);
}

async function playRandomBgm() {
  await loadBgmPlaylist();
  if (bgmVolume <= 0 || !bgmTracks.length) {
    updateBgmControls();
    return;
  }
  const available = bgmTracks.map((_, index) => index).filter((index) => !bgmFailedIndexes.has(index));
  if (!available.length) {
    bgmAudio.pause();
    bgmTrackIndex = -1;
    updateBgmControls();
    return;
  }
  const alternatives = available.filter((index) => index !== bgmTrackIndex);
  const pool = alternatives.length ? alternatives : available;
  bgmTrackIndex = pool[Math.floor(Math.random() * pool.length)];
  bgmAudio.src = bgmTracks[bgmTrackIndex];
  bgmAudio.volume = bgmVolume / 100;
  updateBgmControls();
  try {
    await bgmAudio.play();
  } catch (error) {
    if (error?.name !== 'NotAllowedError') {
      bgmFailedIndexes.add(bgmTrackIndex);
      bgmTrackIndex = -1;
      updateBgmControls();
      queueNextBgm();
    }
  }
}

async function ensureBgmPlaying() {
  if (bgmVolume <= 0) return;
  await loadBgmPlaylist();
  if (!bgmTracks.length) return;
  bgmAudio.volume = bgmVolume / 100;
  if (!bgmAudio.src || bgmAudio.ended || bgmTrackIndex < 0) await playRandomBgm();
  else if (bgmAudio.paused) {
    try { await bgmAudio.play(); } catch {}
  }
  updateBgmControls();
}

function setBgmVolume(value) {
  bgmVolume = Math.max(0, Math.min(100, Math.round(Number(value) || 0)));
  localStorage.setItem('td:bgmVolume', String(bgmVolume));
  bgmAudio.volume = bgmVolume / 100;
  if (bgmVolume === 0) bgmAudio.pause();
  else ensureBgmPlaying();
  updateBgmControls();
}

bgmAudio.addEventListener('ended', () => playRandomBgm());
bgmAudio.addEventListener('error', () => {
  if (bgmTrackIndex >= 0) bgmFailedIndexes.add(bgmTrackIndex);
  bgmTrackIndex = -1;
  updateBgmControls();
  queueNextBgm();
});
document.addEventListener('pointerdown', () => { if (bgmVolume > 0) ensureBgmPlaying(); }, { passive:true });
loadBgmPlaylist();

const battlefieldOrder = ['field','coast','volcano','dojo','forest','storm','swamp','cave','cliff','fog'];
const battlefieldNames = {
  field:'草原の戦い', coast:'浜辺の戦い', volcano:'火山の戦い', dojo:'道場の戦い', forest:'竹林の戦い',
  storm:'嵐の戦い', swamp:'沼地の戦い', cave:'洞窟の戦い', cliff:'崖の上の戦い', fog:'濃霧の戦い'
};

function esc(value) {
  return String(value ?? '').replace(/[&<>'"]/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[c]));
}

function showToast(message, danger = true) {
  toast.textContent = message;
  toast.classList.toggle('success', !danger);
  toast.classList.add('show');
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => toast.classList.remove('show'), 2800);
}

function emit(event, payload = {}, onSuccess = null) {
  if (busy) return;
  busy = true;
  socket.emit(event, payload, (result) => {
    busy = false;
    if (!result?.ok) {
      showToast(result?.error || '操作に失敗しました。');
      return;
    }
    onSuccess?.(result);
  });
}

function tokenKey(roomId) { return `td:token:${roomId}`; }

function roomToken(roomId) { return localStorage.getItem(tokenKey(roomId)); }

function settingsEqual(current, draft) {
  if (!current || !draft) return false;
  return current.battleMode === draft.battleMode
    && current.fixedBattlefield === draft.fixedBattlefield
    && current.cpuLevel === draft.cpuLevel
    && Boolean(current.teamMode) === Boolean(draft.teamMode);
}

function effectiveSettings() {
  return { ...(state?.settings || {}), ...(settingsDraft || {}) };
}

function readSettingsForm() {
  const current = effectiveSettings();
  return {
    battleMode:document.querySelector('#battleMode')?.value || current.battleMode || 'random',
    fixedBattlefield:document.querySelector('#fixedBattle')?.value || current.fixedBattlefield || 'field',
    cpuLevel:document.querySelector('#cpuLevel')?.value || current.cpuLevel || 'normal',
    teamMode:document.querySelector('#teamMode')?.checked ?? Boolean(current.teamMode)
  };
}

function sendSettingsPatch(patch, onSuccess = null) {
  settingsDraft = { ...effectiveSettings(), ...patch };
  clearTimeout(settingsSaveTimer);
  settingsSaveTimer = setTimeout(() => {
    const sending = { ...settingsDraft };
    socket.emit('updateSettings', sending, (result) => {
      if (!result?.ok) {
        settingsDraft = null;
        showToast(result?.error || '設定の保存に失敗しました。');
        render();
        return;
      }
      onSuccess?.(result);
    });
  }, 60);
}

function saveSettingsFromForm() {
  const patch = readSettingsForm();
  settingsDraft = patch;
  const fixed = document.querySelector('#fixedBattle');
  if (fixed) fixed.disabled = !(state?.legal?.canEditSettings && patch.battleMode === 'fixed');
  sendSettingsPatch(patch);
}

function saveSettingsThenStart() {
  const patch = readSettingsForm();
  settingsDraft = patch;
  clearTimeout(settingsSaveTimer);
  socket.emit('updateSettings', patch, (saved) => {
    if (!saved?.ok) {
      settingsDraft = null;
      showToast(saved?.error || '設定の保存に失敗しました。');
      render();
      return;
    }
    socket.emit('startGame', {}, (started) => {
      if (!started?.ok) showToast(started?.error || '対局を開始できませんでした。');
    });
  });
}

socket.on('lobbyState', (nextRooms) => {
  rooms = Array.isArray(nextRooms) ? nextRooms : [];
  if (!state) {
    const roomGrid = document.querySelector('.room-grid');
    if (roomGrid) updateLandingRoomGrid();
    else render();
  }
});

socket.on('state', (next) => {
  const firstState = !state;
  state = next;
  if (settingsDraft && settingsEqual(next.settings, settingsDraft)) settingsDraft = null;
  lastRoomId = next.roomId;
  localStorage.setItem('td:lastRoom', lastRoomId);
  render();
  playTick();
  if (next.specialEvent) {
    const recent = Date.now() - next.specialEvent.at < 4000;
    if (firstState && !recent) lastSpecialId = next.specialEvent.id;
    else showSpecial(next.specialEvent);
  }
});

socket.on('leftRoom', ({ roomId }) => {
  socket.disconnectRoom();
  localStorage.removeItem(tokenKey(roomId));
  localStorage.removeItem('td:lastRoom');
  state = null;
  settingsDraft = null;
  lastRoomId = '';
  lastSpecialId = null;
  render();
});

socket.on('removed', ({ message }) => {
  socket.disconnectRoom();
  if (state?.roomId) localStorage.removeItem(tokenKey(state.roomId));
  localStorage.removeItem('td:lastRoom');
  state = null;
  settingsDraft = null;
  lastRoomId = '';
  showToast(message);
  render();
});

socket.on('roomReset', ({ roomId }) => {
  socket.disconnectRoom();
  localStorage.removeItem(tokenKey(roomId));
  localStorage.removeItem('td:lastRoom');
  state = null;
  settingsDraft = null;
  lastRoomId = '';
  lastSpecialId = null;
  showToast(`第${roomId}対局室を完全初期化しました。`, false);
  render();
});

socket.on('connect', () => {
  connectionMessage = '';
  if (lastRoomId && socket.roomId === lastRoomId) {
    const token = roomToken(lastRoomId);
    if (token) {
      socket.emit('joinRoom', { roomId:lastRoomId, name, token }, (result) => {
        if (!result?.ok) {
          localStorage.removeItem(tokenKey(lastRoomId));
          localStorage.removeItem('td:lastRoom');
          lastRoomId = '';
          state = null;
          render();
        }
      });
    }
  }
  render();
});

socket.on('disconnect', () => {
  if (lastRoomId) connectionMessage = 'サーバーとの接続が切れました。再接続しています。';
  render();
});

socket.on('networkError', ({ message }) => {
  if (!state) connectionMessage = message;
  render();
});

let lastLogId = null;
function playTick() {
  const current = state?.log?.at(-1)?.id;
  if (!current || current === lastLogId) return;
  lastLogId = current;
  try {
    const context = new AudioContext();
    const oscillator = context.createOscillator();
    const gain = context.createGain();
    oscillator.frequency.value = 150;
    gain.gain.setValueAtTime(0.035, context.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, context.currentTime + .065);
    oscillator.connect(gain).connect(context.destination);
    oscillator.start();
    oscillator.stop(context.currentTime + .065);
  } catch {}
}

const SPECIAL_SOUND_URLS = {
  tiger: './sfx/tiger.m4a',
  dragon: './sfx/dragon.m4a'
};
const activeSpecialAudios = new Set();

function playBuiltInSpecialSound(kind) {
  try {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) return;
    const context = new AudioContextClass();
    const now = context.currentTime;
    const frequencies = kind === 'tiger' ? [120, 220, 440] : [100, 180, 330];
    frequencies.forEach((frequency, index) => {
      const oscillator = context.createOscillator();
      const gain = context.createGain();
      oscillator.type = index === 0 ? 'sawtooth' : 'triangle';
      oscillator.frequency.setValueAtTime(frequency, now + index * .06);
      gain.gain.setValueAtTime(0.0001, now + index * .06);
      gain.gain.exponentialRampToValueAtTime(0.09 / (index + 1), now + index * .06 + .025);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + .75);
      oscillator.connect(gain).connect(context.destination);
      oscillator.start(now + index * .06);
      oscillator.stop(now + .8);
    });
    setTimeout(() => context.close().catch(() => {}), 1000);
  } catch {}
}

function playSpecialSound(kind) {
  const source = SPECIAL_SOUND_URLS[kind];
  if (!source) {
    playBuiltInSpecialSound(kind);
    return;
  }

  const audio = new Audio(source);
  audio.preload = 'auto';
  audio.volume = 0.9;
  activeSpecialAudios.add(audio);
  let fallbackPlayed = false;

  const cleanup = () => activeSpecialAudios.delete(audio);
  const fallback = () => {
    cleanup();
    if (fallbackPlayed) return;
    fallbackPlayed = true;
    playBuiltInSpecialSound(kind);
  };

  audio.addEventListener('ended', cleanup, { once:true });
  audio.addEventListener('error', fallback, { once:true });
  audio.play().catch(fallback);
}

function showSpecial(event) {
  if (!event || event.id === lastSpecialId) return;
  lastSpecialId = event.id;
  const isTiger = event.kind === 'tiger';
  specialLayer.innerHTML = `<div class="special-cutin ${isTiger ? 'tiger' : 'dragon'}">

  const legalIds = state.legal.tileIds || [];
  const tiles = state.hand.map((tile) => tileHTML(tile, { clickable:legalIds.includes(tile.id), disabled:!legalIds.includes(tile.id) })).join('');
  return `<footer class="hand-zone"><div class="hand-head"><div><strong>あなたの手牌</strong>　<span class="action-message">${esc(actionText())}</span></div>${state.legal.canPass ? '<button class="btn danger" id="passBtn">パス</button>' : ''}</div><div class="hand">${tiles || '<span class="small-note">手牌はありません</span>'}</div></footer>`;
}

function gameHTML() {
  const attack = state.currentAttack ? `<div class="current-attack">${tileHTML(state.currentAttack.tile, { large:true })}<div><strong>現在の攻め</strong><div class="small-note">受けるかパス</div></div></div>` : `<div class="turn-message">${esc(actionText())}</div>`;
  const players = state.players.map(playerBoardHTML).join('');
  const logs = [...state.log].reverse().map((entry) => `<div class="log-line">${esc(entry.message)}</div>`).join('');
  const battleRed = ['storm','swamp','cave','cliff','fog'].includes(state.battlefield?.id) ? 'red' : '';
  return `<div class="shell">${topbarHTML()}<main class="main"><div class="game-layout"><section class="table-area">
    <div class="battle-card ${battleRed}"><div class="battle-title">${esc(state.battlefield?.name || '')}</div><div class="battle-short">${esc(state.battlefield?.short || '')}</div><div class="battle-detail">${esc(state.battlefield?.detail || '')}／奥義牌上がりは1点・ボーナスなし</div></div>
    ${state.teamScores ? `<div class="score-strip"><div>チームA <strong>${state.teamScores.A}点</strong></div><div>チームB <strong>${state.teamScores.B}点</strong></div></div>` : ''}
    <div class="center-status">${attack}</div><div class="players-grid ${state.players.length === 5 ? 'five' : ''}">${players}</div>
  </section><aside class="side-panel"><div class="card"><h3>第${state.roundNumber}局</h3><div class="action-message">${esc(actionText())}</div><p class="small-note">${esc(battlefieldModeNote())}</p></div><div class="card"><h3>進行ログ</h3><div class="log">${logs}</div></div>${hostControlsHTML()}</aside></div></main>${handHTML()}${resultOverlayHTML()}${rulesOpen ? rulesHTML() : ''}</div>`;
}

function resultOverlayHTML() {
  if (!['roundEnd','gameEnd'].includes(state.status)) return '';
  const result = state.roundResult;
  const isGameEnd = state.status === 'gameEnd';
  const title = isGameEnd ? (state.gameResult.type === 'team' ? `チーム${state.gameResult.team} 総合優勝` : `${esc(state.gameResult.winnerName)} 総合優勝`) : `${esc(result.winnerName)}が上がり`;
  return `<div class="overlay result-overlay"><section class="modal"><h2>${title}</h2><div class="result-row">${tileHTML(result.finalTile, { large:true })}<div><div class="result-score">+${result.score.total}点</div><div>基本 ${result.score.base}点 ＋ ボーナス ${result.score.bonus}点</div></div></div><p>${isGameEnd ? '対戦終了です。' : '次の局では先攻が左隣へ移ります。'}</p><div class="modal-actions">${state.legal.canNextRound ? '<button class="btn primary" id="nextBtn">次の局へ</button>' : ''}${state.legal.canRestart ? '<button class="btn primary" id="restartBtn">同じメンバーで再戦</button>' : ''}${!state.legal.canNextRound && !state.legal.canRestart ? '<span class="small-note">部屋主の操作を待っています。</span>' : ''}</div></section></div>`;
}

function rulesHTML() {
  return `<div class="overlay" id="rulesOverlay"><section class="modal rules"><h2>遊び方</h2>
    <h3>勝利条件</h3><p>手牌を最初に出し切った人が、最後に出した牌と戦場カードに応じて得点します。個人戦は10点、4人チーム戦は15点先取です。</p>
    <h3>攻めと受け</h3><p>攻め牌と同じ数字で受けると、受けた人が次に攻めます。受けられる場合でもパスできます。</p>
    <h3>奥義牌</h3><p>タイガーは偶数、ドラゴンは奇数の攻めを受けられます。奥義牌で攻めた場合は同じ色の牌で受けられます。奥義牌が場に出ると全員の画面に演出が表示されます。</p>
    <h3>1周ボーナス</h3><p>全員がパスして攻めた人まで戻ると、手牌1枚を裏向きで受け列に置き、続けて攻めます。2人戦と奥義牌上がりでは追加点になりません。洞窟では全員分を獲得します。</p>
    <h3>戦場カード</h3><p>戦場は、総合決着まで固定・各ラウンドごとに変更・任意指定の3種類から選べます。各ラウンド変更では、直前と同じ戦場は連続しません。</p><h3>座席順</h3><p>新しい対戦を始めるたびに参加者の座席順をランダムに並べ替えます。局ごとの先攻は、その座席順で左隣へ移ります。</p>
    <div class="modal-actions"><button class="btn" id="closeRulesBtn">閉じる</button></div></section></div>`;
}

function render() {
  app.innerHTML = state ? (state.status === 'lobby' ? lobbyHTML() : gameHTML()) : landingHTML();
  bind();
}

function joinRoom(roomId) {
  name = document.querySelector('#nameInput')?.value.trim() || name || '名無し';
  localStorage.setItem('td:name', name);
  const token = roomToken(roomId);
  emit('joinRoom', { roomId, name, token }, (result) => {
    localStorage.setItem(tokenKey(result.roomId), result.token);
    localStorage.setItem('td:lastRoom', result.roomId);
  });
}

function confirmReset(message, eventName) {
  if (!confirm(message)) return;
  emit(eventName);
}

function bind() {
  bindJoinRoomButtons();
  document.querySelectorAll('.bgm-volume').forEach((input) => input.addEventListener('input', (event) => setBgmVolume(event.target.value)));
  updateBgmControls();
  document.querySelector('#nameInput')?.addEventListener('input', (event) => {
    name = event.target.value;
    localStorage.setItem('td:name', name);
  });
  document.querySelectorAll('#copyUrlBtn').forEach((button) => button.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(location.href.split('#')[0]);
      showToast('ゲームURLをコピーしました。', false);
    } catch { showToast('URLをコピーできませんでした。'); }
  }));
  document.querySelectorAll('#rulesBtn').forEach((button) => button.addEventListener('click', () => { rulesOpen = true; render(); }));
  document.querySelector('#closeRulesBtn')?.addEventListener('click', () => { rulesOpen = false; render(); });
  document.querySelector('#rulesOverlay')?.addEventListener('click', (event) => { if (event.target.id === 'rulesOverlay') { rulesOpen = false; render(); } });
  document.querySelector('#leaveBtn')?.addEventListener('click', () => {
    if (!confirm('この部屋から退出しますか？ 対局中は席が切断状態で残ります。')) return;
    emit('leaveRoom');
  });
  document.querySelector('#addCpuBtn')?.addEventListener('click', () => emit('addCpu'));
  document.querySelectorAll('.remove-player').forEach((button) => button.addEventListener('click', () => emit('removePlayer', { targetId:button.dataset.playerId })));
  document.querySelector('#battleMode')?.addEventListener('change', saveSettingsFromForm);
  document.querySelector('#fixedBattle')?.addEventListener('change', saveSettingsFromForm);
  document.querySelector('#cpuLevel')?.addEventListener('change', saveSettingsFromForm);
  document.querySelector('#teamMode')?.addEventListener('change', saveSettingsFromForm);
  document.querySelector('#startBtn')?.addEventListener('click', saveSettingsThenStart);
  document.querySelector('#passBtn')?.addEventListener('click', () => emit('pass'));
  document.querySelector('#nextBtn')?.addEventListener('click', () => emit('nextRound'));
  document.querySelector('#restartBtn')?.addEventListener('click', () => emit('restartGame'));
  document.querySelectorAll('#resetMatchBtn').forEach((button) => button.addEventListener('click', () => confirmReset('参加者を残して対局を設定画面へ戻します。よろしいですか？', 'resetMatch')));
  document.querySelectorAll('#hardResetBtn').forEach((button) => button.addEventListener('click', () => confirmReset('全員を退出させ、第' + state.roomId + '対局室を完全な空室へ戻します。よろしいですか？', 'hardReset')));
  document.querySelectorAll('[data-tile-id]').forEach((button) => button.addEventListener('click', () => {
    const tileId = button.dataset.tileId;
    const action = state.legal.action;
    if (action === 'ATTACK') emit('playAttack', { tileId });
    else if (action === 'DEFEND') emit('defend', { tileId });
    else if (action === 'BONUS') emit('claimBonus', { tileId });
    else if (action === 'REVEAL') emit('revealTile', { tileId });
  }));
}

socket.refreshLobby();
setInterval(() => socket.refreshLobby(), 2000);

if (lastRoomId && roomToken(lastRoomId)) {
  socket.connect(lastRoomId).catch((error) => {
    connectionMessage = error.message;
    render();
  });
}

render();

  </script>
</body>
</html>
